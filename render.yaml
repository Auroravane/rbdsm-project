services:
  # Backend Web Service (Node.js API)
  - type: web
    name: boardnight-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_URL
        fromService:
          name: boardnight-frontend
          type: web
          property: host
      - key: FRONTEND_URL
        fromService:
          name: boardnight-frontend
          type: web
          property: host
      # MySQL Database connection parameters (to be configured in Render Dashboard or synced database)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # Frontend Static Site (Vite + React)
  - type: web
    name: boardnight-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA rewrite rule: redirect all non-file client-side routes to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: boardnight-backend
          type: web
          property: host
